name: GSP Booter exec-sequence planner tests

on:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:

permissions:
  contents: read

jobs:
  booter-exec-sequence:
    name: booter exec sequence (${{ matrix.os }}, ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            compiler: g++
          - os: ubuntu-latest
            compiler: clang++
          - os: macos-latest
            compiler: clang++
    steps:
      - name: checkout
        uses: actions/checkout@v4
        timeout-minutes: 2

      - name: compile pure ga107 sec2 exec-sequence tests
        shell: bash
        timeout-minutes: 2
        env:
          CXX: ${{ matrix.compiler }}
        run: |
          python3 - <<'PY'
          import os
          import subprocess
          subprocess.run([
              os.environ["CXX"], "-std=c++17", "-O2",
              "-Wall", "-Wextra", "-Wpedantic", "-Werror",
              "-Iphase0-kext",
              "tests/test_nv_gsp_booter_exec_sequence_plan.cpp",
              "-o", "/tmp/test-nv-gsp-booter-exec-sequence"
          ], check=True, timeout=30)
          PY

      - name: run pure ga107 sec2 exec-sequence tests
        shell: bash
        timeout-minutes: 2
        run: |
          python3 - <<'PY'
          import subprocess
          subprocess.run([
              "/tmp/test-nv-gsp-booter-exec-sequence"
          ], check=True, timeout=30)
          PY

      - name: verify pure/no-write executor-planner source shape
        shell: bash
        timeout-minutes: 2
        run: |
          python3 - <<'PY'
          import subprocess
          subprocess.run([
              "python3", "tests/test_nv_gsp_booter_exec_sequence_shape.py"
          ], check=True, timeout=30)
          PY
