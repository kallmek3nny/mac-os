name: Intel persistent surface PPGTT transaction tests

on:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:

permissions:
  contents: read

jobs:
  surface-pte-txn:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - name: checkout
        uses: actions/checkout@v4
        timeout-minutes: 2

      - name: compile PPGTT transaction test
        timeout-minutes: 2
        run: |
          python3 - <<'PY'
          import subprocess
          subprocess.run([
              "c++", "-std=c++17", "-Wall", "-Wextra", "-Werror",
              "-Iphase0-kext", "tests/test_intel_gt_surface_txn.cpp",
              "-o", "/tmp/test-intel-gt-surface-txn"
          ], check=True, timeout=30)
          PY

      - name: run PPGTT transaction test
        timeout-minutes: 2
        run: |
          python3 - <<'PY'
          import subprocess
          subprocess.run(["/tmp/test-intel-gt-surface-txn"], check=True, timeout=30)
          PY
