name: Intel plane live observer tests

on:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:

permissions:
  contents: read

jobs:
  plane-live-observer:
    name: plane live observer (${{ matrix.os }}, ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            compiler: g++
          - os: ubuntu-latest
            compiler: clang++
          - os: macos-latest
            compiler: clang++
    steps:
      - name: checkout
        uses: actions/checkout@v4
        timeout-minutes: 2

      - name: compile pure live-observer tests
        shell: bash
        timeout-minutes: 2
        env:
          CXX: ${{ matrix.compiler }}
        run: |
          python3 - <<'PY'
          import os
          import subprocess
          subprocess.run([
              os.environ["CXX"], "-std=c++17", "-O2",
              "-Wall", "-Wextra", "-Wpedantic", "-Werror",
              "-Iphase0-kext",
              "tests/test_intel_plane_live_observe.cpp",
              "-o", "/tmp/test-intel-plane-live-observe"
          ], check=True, timeout=30)
          PY

      - name: run pure live-observer tests
        shell: bash
        timeout-minutes: 2
        run: |
          python3 - <<'PY'
          import subprocess
          subprocess.run(["/tmp/test-intel-plane-live-observe"], check=True, timeout=30)
          PY
