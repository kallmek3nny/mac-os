name: GSP WPR metadata candidate tests

on:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:

permissions:
  contents: read

jobs:
  wpr-candidate:
    name: WPR metadata candidate (${{ matrix.os }})
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: checkout
        uses: actions/checkout@v4
        timeout-minutes: 2

      - name: build WPR metadata candidate test
        shell: bash
        timeout-minutes: 2
        run: |
          set -euxo pipefail
          c++ -std=c++17 -O2 -Wall -Wextra -Wpedantic \
            -I phase0-kext tests/test_nv_gsp_wpr_candidate.cpp \
            -o test_nv_gsp_wpr_candidate

      - name: run WPR metadata candidate test
        timeout-minutes: 2
        run: ./test_nv_gsp_wpr_candidate
