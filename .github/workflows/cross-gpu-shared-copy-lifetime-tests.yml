name: Cross-GPU shared copy lifetime tests

on:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:

permissions:
  contents: read

jobs:
  shared-copy-lifetime:
    name: shared copy lifetime (${{ matrix.os }}, ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            compiler: g++
          - os: ubuntu-latest
            compiler: clang++
          - os: macos-latest
            compiler: clang++
    steps:
      - name: checkout
        uses: actions/checkout@v4
        timeout-minutes: 2

      - name: compile pure cross-gpu lifetime tests
        shell: bash
        timeout-minutes: 2
        env:
          CXX: ${{ matrix.compiler }}
        run: |
          python3 - <<'PY'
          import os
          import subprocess
          subprocess.run([
              os.environ["CXX"], "-std=c++17", "-O2",
              "-Wall", "-Wextra", "-Wpedantic", "-Werror",
              "-Iphase0-kext",
              "tests/test_nv_intel_shared_copy_lifetime.cpp",
              "-o", "/tmp/test-nv-intel-shared-copy-lifetime"
          ], check=True, timeout=30)
          PY

      - name: run pure cross-gpu lifetime tests
        shell: bash
        timeout-minutes: 2
        run: |
          python3 - <<'PY'
          import subprocess
          subprocess.run([
              "/tmp/test-nv-intel-shared-copy-lifetime"
          ], check=True, timeout=30)
          PY

      - name: verify pure/no-write cross-gpu lifetime source shape
        shell: bash
        timeout-minutes: 2
        run: |
          python3 - <<'PY'
          import subprocess
          subprocess.run([
              "python3", "tests/test_nv_intel_shared_copy_lifetime_shape.py"
          ], check=True, timeout=30)
          PY
