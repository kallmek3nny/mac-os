name: cross-platform build

on:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:

permissions:
  contents: read

jobs:
  host-tests:
    name: host tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: toolchain info
        shell: bash
        run: |
          set -euxo pipefail
          cmake --version
          c++ --version || true
          python3 --version

      - name: configure host tests
        run: cmake -S tests -B build/host -DCMAKE_BUILD_TYPE=Release

      - name: build host tests
        run: cmake --build build/host --config Release --parallel 2

      - name: run host tests
        run: ctest --test-dir build/host -C Release --output-on-failure

      - name: build PPGTT context test
        shell: bash
        run: |
          set -euxo pipefail
          c++ -std=c++17 -O2 -Wall -Wextra -Wpedantic \
            -I phase0-kext tests/test_intel_gt_ppgtt.cpp \
            -o build/host/test_intel_gt_ppgtt_manual

      - name: run PPGTT context test
        run: ./build/host/test_intel_gt_ppgtt_manual

      - name: build Gen12 LRC test
        shell: bash
        run: |
          set -euxo pipefail
          c++ -std=c++17 -O2 -Wall -Wextra -Wpedantic \
            -I phase0-kext tests/test_intel_gt_lrc.cpp \
            -o build/host/test_intel_gt_lrc_manual

      - name: run Gen12 LRC test
        run: ./build/host/test_intel_gt_lrc_manual

      - name: build private-PPGTT dispatch test
        shell: bash
        run: |
          set -euxo pipefail
          c++ -std=c++17 -O2 -Wall -Wextra -Wpedantic \
            -I phase0-kext tests/test_intel_gt_dispatch.cpp \
            -o build/host/test_intel_gt_dispatch_manual

      - name: run private-PPGTT dispatch test
        run: ./build/host/test_intel_gt_dispatch_manual

      - name: build Gen12 CSB retirement test
        shell: bash
        run: |
          set -euxo pipefail
          c++ -std=c++17 -O2 -Wall -Wextra -Wpedantic \
            -I phase0-kext tests/test_intel_gt_csb.cpp \
            -o build/host/test_intel_gt_csb_manual

      - name: run Gen12 CSB retirement test
        run: ./build/host/test_intel_gt_csb_manual

      - name: build multi-chunk copy planner test
        shell: bash
        run: |
          set -euxo pipefail
          c++ -std=c++17 -O2 -Wall -Wextra -Wpedantic \
            -I phase0-kext tests/test_intel_gt_copy_plan.cpp \
            -o build/host/test_intel_gt_copy_plan_manual

      - name: run multi-chunk copy planner test
        run: ./build/host/test_intel_gt_copy_plan_manual

      - name: build staged sink candidate test
        shell: bash
        run: |
          set -euxo pipefail
          c++ -std=c++17 -O2 -Wall -Wextra -Wpedantic \
            -I phase0-kext tests/test_intel_sink_candidate.cpp \
            -o build/host/test_intel_sink_candidate_manual

      - name: run staged sink candidate test
        run: ./build/host/test_intel_sink_candidate_manual

  macos-kext:
    name: macos kext + userspace build
    runs-on: macos-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: apple toolchain info
        shell: bash
        run: |
          set -euxo pipefail
          sw_vers
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-path
          xcrun --sdk macosx --find clang++

      - name: build kext
        run: make -C phase0-kext clean all

      - name: build userspace blit client
        run: make -C phase0-kext gt-blit-tool
