name: Cross-GPU anchored handoff provenance tests

on:
  push:
    branches:
      - agent/cross-gpu-lifetime-provenance-anchor
    paths:
      - "phase0-kext/NvIntelSharedSurfaceHandoffAnchoredProvenance.hpp"
      - "phase0-kext/NvIntelSharedSurfaceHandoffProvenance.hpp"
      - "phase0-kext/NvIntelSharedSurfaceHandoff.hpp"
      - "phase0-kext/NvIntelSharedCopyLifetime.hpp"
      - "phase0-kext/IntelDisplayTransactionLifetime.hpp"
      - "tests/test_nv_intel_shared_surface_handoff_anchored_provenance.cpp"
      - "tests/test_nv_intel_shared_surface_handoff_anchored_provenance_shape.py"
      - ".github/workflows/cross-gpu-anchored-provenance-tests.yml"
  pull_request:
    paths:
      - "phase0-kext/NvIntelSharedSurfaceHandoffAnchoredProvenance.hpp"
      - "phase0-kext/NvIntelSharedSurfaceHandoffProvenance.hpp"
      - "phase0-kext/NvIntelSharedSurfaceHandoff.hpp"
      - "phase0-kext/NvIntelSharedCopyLifetime.hpp"
      - "phase0-kext/IntelDisplayTransactionLifetime.hpp"
      - "tests/test_nv_intel_shared_surface_handoff_anchored_provenance.cpp"
      - "tests/test_nv_intel_shared_surface_handoff_anchored_provenance_shape.py"
      - ".github/workflows/cross-gpu-anchored-provenance-tests.yml"

permissions:
  contents: read

jobs:
  anchored-provenance:
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cxx: g++
          - os: ubuntu-latest
            cxx: clang++
          - os: macos-latest
            cxx: clang++
    runs-on: ${{ matrix.os }}
    steps:
      - name: checkout
        uses: actions/checkout@v4
        timeout-minutes: 2

      - name: compile and run pure anchored provenance tests
        timeout-minutes: 3
        env:
          CXX: ${{ matrix.cxx }}
        run: |
          python3 - <<'PY'
          import os
          import subprocess
          from pathlib import Path

          root = Path.cwd()
          exe = root / "anchored-provenance-test"
          compile_cmd = [
              os.environ["CXX"],
              "-std=c++17",
              "-O2",
              "-Wall",
              "-Wextra",
              "-Wpedantic",
              "-Werror",
              "-Iphase0-kext",
              "tests/test_nv_intel_shared_surface_handoff_anchored_provenance.cpp",
              "-o",
              str(exe),
          ]
          subprocess.run(compile_cmd, check=True, timeout=30)
          subprocess.run([str(exe)], check=True, timeout=30)
          PY

      - name: verify pure no-write anchored provenance source shape
        timeout-minutes: 2
        run: |
          python3 - <<'PY'
          import subprocess
          subprocess.run(
              ["python3", "tests/test_nv_intel_shared_surface_handoff_anchored_provenance_shape.py"],
              check=True,
              timeout=30,
          )
          PY
