name: GSP WPR staging and policy tests

on:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:

permissions:
  contents: read

jobs:
  wpr-pure:
    name: WPR pure contracts (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: build WPR sysmem bridge test
        shell: bash
        run: |
          set -euxo pipefail
          c++ -std=c++17 -O2 -Wall -Wextra -Wpedantic \
            -I phase0-kext tests/test_nv_gsp_wpr_sysmem.cpp \
            -o test_nv_gsp_wpr_sysmem

      - name: run WPR sysmem bridge test
        run: ./test_nv_gsp_wpr_sysmem

      - name: build GA107 WPR policy test
        shell: bash
        run: |
          set -euxo pipefail
          c++ -std=c++17 -O2 -Wall -Wextra -Wpedantic \
            -I phase0-kext tests/test_nv_gsp_wpr_policy.cpp \
            -o test_nv_gsp_wpr_policy

      - name: run GA107 WPR policy test
        run: ./test_nv_gsp_wpr_policy
