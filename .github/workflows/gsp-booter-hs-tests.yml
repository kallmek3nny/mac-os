name: GSP Booter HS planner tests

on:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:

permissions:
  contents: read

jobs:
  booter-hs:
    name: Booter HS planner (${{ matrix.os }})
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: checkout
        uses: actions/checkout@v4
        timeout-minutes: 2

      - name: build Booter HS planner test
        shell: bash
        timeout-minutes: 2
        run: |
          set -euxo pipefail
          c++ -std=c++17 -O2 -Wall -Wextra -Wpedantic \
            -I phase0-kext tests/test_nv_gsp_booter_hs.cpp \
            -o test_nv_gsp_booter_hs

      - name: run Booter HS planner test
        timeout-minutes: 2
        run: ./test_nv_gsp_booter_hs
