name: GSP transport tests

on:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:

permissions:
  contents: read

jobs:
  gsp-transport:
    name: GSP transport (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: toolchain info
        shell: bash
        run: |
          set -euxo pipefail
          c++ --version || true

      - name: build GSP queue layout test
        shell: bash
        run: |
          set -euxo pipefail
          c++ -std=c++17 -O2 -Wall -Wextra -Wpedantic \
            -I phase0-kext tests/test_nv_gsp_queue_plan.cpp \
            -o test_nv_gsp_queue_plan

      - name: run GSP queue layout test
        run: ./test_nv_gsp_queue_plan

      - name: build GSP RPC frame test
        shell: bash
        run: |
          set -euxo pipefail
          c++ -std=c++17 -O2 -Wall -Wextra -Wpedantic \
            -I phase0-kext tests/test_nv_gsp_rpc_frame.cpp \
            -o test_nv_gsp_rpc_frame

      - name: run GSP RPC frame test
        run: ./test_nv_gsp_rpc_frame

      - name: build GSP MSGQ TX test
        shell: bash
        run: |
          set -euxo pipefail
          c++ -std=c++17 -O2 -Wall -Wextra -Wpedantic \
            -I phase0-kext tests/test_nv_gsp_queue_tx.cpp \
            -o test_nv_gsp_queue_tx

      - name: run GSP MSGQ TX test
        run: ./test_nv_gsp_queue_tx

      - name: build PGSP queue register test
        shell: bash
        run: |
          set -euxo pipefail
          c++ -std=c++17 -O2 -Wall -Wextra -Wpedantic \
            -I phase0-kext tests/test_nv_gsp_queue_regs.cpp \
            -o test_nv_gsp_queue_regs

      - name: run PGSP queue register test
        run: ./test_nv_gsp_queue_regs

      - name: build GSP MSGQ init/link test
        shell: bash
        run: |
          set -euxo pipefail
          c++ -std=c++17 -O2 -Wall -Wextra -Wpedantic \
            -I phase0-kext tests/test_nv_gsp_queue_init.cpp \
            -o test_nv_gsp_queue_init

      - name: run GSP MSGQ init/link test
        run: ./test_nv_gsp_queue_init

      - name: build GSP MSGQ RX test
        shell: bash
        run: |
          set -euxo pipefail
          c++ -std=c++17 -O2 -Wall -Wextra -Wpedantic \
            -I phase0-kext tests/test_nv_gsp_queue_rx.cpp \
            -o test_nv_gsp_queue_rx

      - name: run GSP MSGQ RX test
        run: ./test_nv_gsp_queue_rx

      - name: build GSP RPC transaction rehearsal
        shell: bash
        run: |
          set -euxo pipefail
          c++ -std=c++17 -O2 -Wall -Wextra -Wpedantic \
            -I phase0-kext tests/test_nv_gsp_rpc_transaction.cpp \
            -o test_nv_gsp_rpc_transaction

      - name: run GSP RPC transaction rehearsal
        run: ./test_nv_gsp_rpc_transaction

      - name: build GSP RPC response semantics test
        shell: bash
        run: |
          set -euxo pipefail
          c++ -std=c++17 -O2 -Wall -Wextra -Wpedantic \
            -I phase0-kext tests/test_nv_gsp_rpc_response.cpp \
            -o test_nv_gsp_rpc_response

      - name: run GSP RPC response semantics test
        run: ./test_nv_gsp_rpc_response

      - name: build GSP queue observation classifier
        shell: bash
        run: |
          set -euxo pipefail
          c++ -std=c++17 -O2 -Wall -Wextra -Wpedantic \
            -I phase0-kext tests/test_nv_gsp_queue_observe.cpp \
            -o test_nv_gsp_queue_observe

      - name: run GSP queue observation classifier
        run: ./test_nv_gsp_queue_observe

      - name: build GSP shared queue memory test
        shell: bash
        run: |
          set -euxo pipefail
          c++ -std=c++17 -O2 -Wall -Wextra -Wpedantic \
            -I phase0-kext tests/test_nv_gsp_queue_memory.cpp \
            -o test_nv_gsp_queue_memory

      - name: run GSP shared queue memory test
        run: ./test_nv_gsp_queue_memory

      - name: build GSP queue DMA flattening test
        shell: bash
        run: |
          set -euxo pipefail
          c++ -std=c++17 -O2 -Wall -Wextra -Wpedantic \
            -I phase0-kext tests/test_nv_gsp_queue_dma.cpp \
            -o test_nv_gsp_queue_dma

      - name: run GSP queue DMA flattening test
        run: ./test_nv_gsp_queue_dma

      - name: build GSP RMARGS queue overlay test
        shell: bash
        run: |
          set -euxo pipefail
          c++ -std=c++17 -O2 -Wall -Wextra -Wpedantic \
            -I phase0-kext tests/test_nv_gsp_cached_args.cpp \
            -o test_nv_gsp_cached_args

      - name: run GSP RMARGS queue overlay test
        run: ./test_nv_gsp_cached_args

      - name: build GSP LibOS init handoff test
        shell: bash
        run: |
          set -euxo pipefail
          c++ -std=c++17 -O2 -Wall -Wextra -Wpedantic \
            -I phase0-kext tests/test_nv_gsp_libos_init.cpp \
            -o test_nv_gsp_libos_init

      - name: run GSP LibOS init handoff test
        run: ./test_nv_gsp_libos_init

      - name: build complete GSP bootargs rehearsal
        shell: bash
        run: |
          set -euxo pipefail
          c++ -std=c++17 -O2 -Wall -Wextra -Wpedantic \
            -I phase0-kext tests/test_nv_gsp_bootargs_rehearsal.cpp \
            -o test_nv_gsp_bootargs_rehearsal

      - name: run complete GSP bootargs rehearsal
        run: ./test_nv_gsp_bootargs_rehearsal

      - name: build GA107 WPR metadata layout test
        shell: bash
        run: |
          set -euxo pipefail
          c++ -std=c++17 -O2 -Wall -Wextra -Wpedantic \
            -I phase0-kext tests/test_nv_gsp_wpr_meta.cpp \
            -o test_nv_gsp_wpr_meta

      - name: run GA107 WPR metadata layout test
        run: ./test_nv_gsp_wpr_meta

      - name: build cold-boot WPR metadata image test
        shell: bash
        run: |
          set -euxo pipefail
          c++ -std=c++17 -O2 -Wall -Wextra -Wpedantic \
            -I phase0-kext tests/test_nv_gsp_wpr_image.cpp \
            -o test_nv_gsp_wpr_image

      - name: run cold-boot WPR metadata image test
        run: ./test_nv_gsp_wpr_image

      - name: build GSP Radix3 firmware image test
        shell: bash
        run: |
          set -euxo pipefail
          c++ -std=c++17 -O2 -Wall -Wextra -Wpedantic \
            -I phase0-kext tests/test_nv_gsp_radix3.cpp \
            -o test_nv_gsp_radix3

      - name: run GSP Radix3 firmware image test
        run: ./test_nv_gsp_radix3

      - name: build GSP .fwimage container test
        shell: bash
        run: |
          set -euxo pipefail
          c++ -std=c++17 -O2 -Wall -Wextra -Wpedantic \
            -I phase0-kext tests/test_nv_gsp_fw_container.cpp \
            -o test_nv_gsp_fw_container

      - name: run GSP .fwimage container test
        run: ./test_nv_gsp_fw_container

      - name: build full GSP-RM image staging plan
        shell: bash
        run: |
          set -euxo pipefail
          c++ -std=c++17 -O2 -Wall -Wextra -Wpedantic \
            -I phase0-kext tests/test_nv_gsp_rm_image.cpp \
            -o test_nv_gsp_rm_image

      - name: run full GSP-RM image staging plan
        run: ./test_nv_gsp_rm_image

      - name: build WPR boot-ucode staging plan
        shell: bash
        run: |
          set -euxo pipefail
          c++ -std=c++17 -O2 -Wall -Wextra -Wpedantic \
            -I phase0-kext tests/test_nv_gsp_wpr_boot_ucode.cpp \
            -o test_nv_gsp_wpr_boot_ucode

      - name: run WPR boot-ucode staging plan
        run: ./test_nv_gsp_wpr_boot_ucode

      - name: build GA107 cold-boot WPR policy test
        shell: bash
        run: |
          set -euxo pipefail
          c++ -std=c++17 -O2 -Wall -Wextra -Wpedantic \
            -I phase0-kext tests/test_nv_gsp_wpr_ga107.cpp \
            -o test_nv_gsp_wpr_ga107

      - name: run GA107 cold-boot WPR policy test
        run: ./test_nv_gsp_wpr_ga107
