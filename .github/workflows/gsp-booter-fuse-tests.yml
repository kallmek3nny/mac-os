name: GSP Booter fuse observer tests

on:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:

permissions:
  contents: read

jobs:
  booter-fuse:
    name: Booter fuse observer (${{ matrix.os }})
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: checkout
        uses: actions/checkout@v4
        timeout-minutes: 2

      - name: build Booter fuse observer test
        shell: bash
        timeout-minutes: 2
        run: |
          set -euxo pipefail
          c++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror \
            -I phase0-kext tests/test_nv_gsp_booter_fuse.cpp \
            -o test_nv_gsp_booter_fuse

      - name: run Booter fuse observer test
        timeout-minutes: 2
        run: ./test_nv_gsp_booter_fuse

      - name: verify runtime observer is read-only
        shell: bash
        timeout-minutes: 2
        run: python3 tests/test_nv_gsp_booter_fuse_observer_static.py
