name: GSP Booter production signature patch tests

on:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:

permissions:
  contents: read

jobs:
  booter-signature-patch:
    name: Booter signature patch (${{ matrix.os }})
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: checkout
        uses: actions/checkout@v4
        timeout-minutes: 2

      - name: build Booter signature patch test
        shell: bash
        timeout-minutes: 2
        run: |
          python3 - <<'PY'
          import subprocess
          subprocess.run([
              "c++", "-std=c++17", "-O2", "-Wall", "-Wextra", "-Wpedantic", "-Werror",
              "-I", "phase0-kext", "tests/test_nv_gsp_booter_patch.cpp",
              "-o", "test_nv_gsp_booter_patch"
          ], check=True, timeout=30)
          PY

      - name: run Booter signature patch test
        timeout-minutes: 2
        run: |
          python3 - <<'PY'
          import subprocess
          subprocess.run(["./test_nv_gsp_booter_patch"], check=True, timeout=30)
          PY
