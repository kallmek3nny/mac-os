name: Intel BCS fill tests

on:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:

jobs:
  fill-host:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 2
      - name: compile fenced fill golden test
        timeout-minutes: 2
        run: >-
          c++ -std=c++17 -Wall -Wextra -Werror
          -Iphase0-kext
          tests/test_intel_gt_fill.cpp
          phase0-kext/IntelGtBlitter.cpp
          -o /tmp/test-intel-gt-fill
      - name: run fenced fill golden test
        timeout-minutes: 2
        run: /tmp/test-intel-gt-fill
