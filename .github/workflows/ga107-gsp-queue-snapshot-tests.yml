name: GA107 read-only GSP queue snapshot consistency

on:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:

permissions:
  contents: read

jobs:
  queue-snapshot:
    name: queue snapshot (${{ matrix.os }}, ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            compiler: g++
          - os: ubuntu-latest
            compiler: clang++
          - os: macos-latest
            compiler: clang++
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run strict bounded queue observer tests
        shell: bash
        env:
          CXX: ${{ matrix.compiler }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import subprocess

          subprocess.run([
              os.environ["CXX"], "-std=c++17", "-O2", "-Wall",
              "-Wextra", "-Wpedantic", "-Werror", "-I", "phase0-kext",
              "tests/test_nv_gsp_queue_observe.cpp", "-o",
              "test_nv_gsp_queue_observe",
          ], check=True, timeout=120)
          subprocess.run(["./test_nv_gsp_queue_observe"],
                         check=True, timeout=30)
          subprocess.run(
              ["python3", "tests/test_nv_gsp_queue_observer_static.py"],
              check=True, timeout=20)
          PY
