name: Intel persistent surface handle userclient tests

on:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:

permissions:
  contents: read

jobs:
  surface-handle-userclient:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - name: checkout
        uses: actions/checkout@v4
        timeout-minutes: 2

      - name: compile persistent handle ABI test
        timeout-minutes: 2
        run: |
          python3 - <<'PY'
          import subprocess
          subprocess.run([
              "c++", "-std=c++17", "-Wall", "-Wextra", "-Werror",
              "-Iphase0-kext", "tests/test_intel_gt_surface_handle_abi.cpp",
              "-o", "/tmp/test-intel-gt-surface-handle-abi"
          ], check=True, timeout=30)
          PY

      - name: run persistent handle ABI test
        timeout-minutes: 2
        run: |
          python3 - <<'PY'
          import subprocess
          subprocess.run(["/tmp/test-intel-gt-surface-handle-abi"], check=True, timeout=30)
          PY

      - name: verify userclient safety shape
        timeout-minutes: 2
        run: |
          python3 - <<'PY'
          import subprocess
          subprocess.run([
              "python3", "tests/test_intel_gt_surface_handle_userclient_shape.py"
          ], check=True, timeout=30)
          PY
