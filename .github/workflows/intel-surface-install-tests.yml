name: Intel persistent surface install tests

on:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:

permissions:
  contents: read

jobs:
  persistent-surface-install:
    name: persistent surface install (${{ matrix.os }})
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: checkout
        uses: actions/checkout@v4
        timeout-minutes: 2

      - name: build transaction test
        timeout-minutes: 2
        run: |
          python3 - <<'PY'
          import subprocess
          subprocess.run([
              "c++", "-std=c++17", "-O2", "-Wall", "-Wextra", "-Werror",
              "-Iphase0-kext", "tests/test_intel_gt_surface_install.cpp",
              "-o", "/tmp/test-intel-gt-surface-install"
          ], check=True, timeout=30)
          PY

      - name: run transaction test
        timeout-minutes: 2
        run: |
          python3 - <<'PY'
          import subprocess
          subprocess.run(["/tmp/test-intel-gt-surface-install"], check=True, timeout=30)
          PY

      - name: verify runtime safety shape
        timeout-minutes: 2
        run: |
          python3 - <<'PY'
          import subprocess
          subprocess.run([
              "python3", "tests/test_intel_gt_surface_bringup_shape.py"
          ], check=True, timeout=30)
          PY
